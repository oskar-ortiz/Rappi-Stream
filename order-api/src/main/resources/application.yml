spring:
  application:
    name: order-api
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:rappi}
    password: ${SPRING_RABBITMQ_PASSWORD:change-me}
    connection-timeout: ${SPRING_RABBITMQ_CONNECTION_TIMEOUT:5000}
    # Relaciona las confirmaciones del broker con el CorrelationData de cada publicacion.
    publisher-confirm-type: correlated
    # Habilita devoluciones por falta de ruta junto con mandatory en RabbitTemplate.
    publisher-returns: true
server:
  port: ${SERVER_PORT:8080}
app:
  rabbitmq:
    queue: ${NEW_ORDERS_QUEUE:new_orders_queue}
  broker:
    confirm-timeout-ms: ${BROKER_CONFIRM_TIMEOUT_MS:5000}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
