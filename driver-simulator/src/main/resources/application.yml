spring:
  application:
    name: driver-simulator
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${DRIVER_SIMULATOR_GROUP_ID:driver-simulator-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.rappistream.driversimulator.service
        spring.json.value.default.type: com.rappistream.driversimulator.service.DriverSimulatorService$DriverEvent
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  kafka:
    topic: ${KAFKA_TOPIC:order_events}
  driver:
    arriving-delay-seconds: ${DRIVER_ARRIVING_DELAY_SECONDS:5}
    delivered-delay-seconds: ${ORDER_DELIVERED_DELAY_SECONDS:10}
