spring:
  application:
    name: notification-router
  main:
    web-application-type: none
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.rappistream.notificationrouter.service
        spring.json.value.default.type: com.rappistream.notificationrouter.service.NotificationRouterService$OrderEvent
        spring.json.use.type.headers: false
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:rappi}
    password: ${SPRING_RABBITMQ_PASSWORD:change-me}
