spring:
  application:
    name: push-notification-worker
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:rappi}
    password: ${SPRING_RABBITMQ_PASSWORD:change-me}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  rabbitmq:
    queue: ${PUSH_QUEUE:push_queue}
